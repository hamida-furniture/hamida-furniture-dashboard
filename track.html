<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b6e6e">
<title>আপনার অর্ডারের অবস্থা</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f3;--card:#fff;--fg:#17211f;--muted:#5a6967;--line:#d3dcdb;--green:#0b6e6e;--orange:#e8891c;--orange-soft:#fbe9cc;--red:#c62828}
@media (prefers-color-scheme:dark){:root{--bg:#0e1514;--card:#182120;--fg:#eef3f2;--muted:#a3b2af;--line:#2a3735;--green:#3fb8ae;--orange:#f0a040;--orange-soft:#3a2a10;--red:#ff6b6f}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:'Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif;line-height:1.55;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:560px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 12px}
h1{font-size:20px;margin:0 0 2px}h2{font-size:17px;margin:0 0 10px}
.muted{color:var(--muted);font-size:14px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.brand img{height:54px;width:auto;max-width:140px;object-fit:contain}
.shop{color:var(--green);font-weight:700;font-size:17px}
.cust{margin-top:10px;font-size:15px;line-height:1.7}.cust div{display:flex;gap:8px}.cust i{font-style:normal;flex:none}
.now{background:var(--orange-soft);border-radius:12px;padding:12px;margin-top:12px}.now b{font-size:18px}
.bar{height:8px;border-radius:8px;background:rgba(0,0,0,.12);margin:10px 0 4px;overflow:hidden}.bar span{display:block;height:100%;background:var(--orange);border-radius:8px;transition:width .8s ease}
.cancel{background:#ffebee;color:var(--red);border:1.5px solid var(--red);border-radius:12px;padding:12px;font-weight:700;text-align:center;margin-top:12px}
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;display:flex;gap:12px;padding:0 0 16px;opacity:0;animation:in .45s ease forwards;animation-delay:calc(var(--i)*60ms)}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.tl li:last-child{padding-bottom:0}
.tl li:not(:last-child)::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line)}
.tl li.done:not(:last-child)::before{background:var(--green)}
.dot{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:700;background:var(--card);color:var(--muted)}
.done .dot{background:var(--green);border-color:var(--green);color:#fff}
.cur .dot{border-color:var(--orange);background:var(--orange);color:#1d1200;box-shadow:0 0 0 5px var(--orange-soft)}
.lbl{padding-top:2px}.done .lbl{color:var(--muted)}.cur .lbl{font-weight:700;font-size:17px}.todo .lbl{color:var(--muted);opacity:.75}
.up{border-top:1px solid var(--line);padding:12px 0}.up:first-of-type{border-top:0;padding-top:0}
.up img{display:block;max-width:100%;border-radius:12px;margin-top:8px;cursor:zoom-in}
.err{text-align:center;padding:40px 10px}
.fb{display:flex;align-items:center;justify-content:center;gap:10px;background:#1877f2;color:#fff;text-decoration:none;font-weight:700;border-radius:12px;padding:12px 14px;margin:0 0 12px}
.fb svg{width:24px;height:24px;fill:#fff;flex:none}
.rv{background:var(--orange-soft);border:1px solid var(--orange);border-radius:16px;padding:14px;margin:0 0 12px}.rv b{display:block;margin-bottom:6px}
.rv a,#pop a{display:inline-block;margin-top:8px;background:var(--orange);color:#1d1200;text-decoration:none;font-weight:700;border-radius:10px;padding:9px 14px}
#pop{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:540px;margin:0 auto;background:var(--card);border:2px solid var(--orange);border-radius:16px;padding:14px 40px 14px 14px;box-shadow:0 10px 30px rgba(0,0,0,.35);transform:translateY(160%);transition:transform .45s ease;z-index:8}
#pop.on{transform:translateY(0)}#pop button{position:absolute;top:6px;right:8px;border:0;background:none;color:var(--muted);font-size:22px;cursor:pointer}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:9;padding:10px}#ov img{max-width:100%;max-height:100%;border-radius:8px}
.foot{text-align:center;color:var(--muted);font-size:13px;padding:6px 0 20px}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="card muted">লোড হচ্ছে…</div></div>
<div id="pop" role="status" aria-live="polite"></div>
<div id="ov" role="dialog" aria-label="ছবি"><img alt=""></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
// এই পেজ শুধু একটা ডকুমেন্টই পড়তে পারে: tracking/{গোপন কোড}। লগইন লাগে না, অন্য কোনো ডেটায় ঢুকতে পারে না।
const fbApp = initializeApp({
  apiKey: "AIzaSyCZp4eIXTNfaDiPDVoi4pc04WoPH8e7OFc",
  authDomain: "rahman-furniture-b8bdd.firebaseapp.com",
  projectId: "rahman-furniture-b8bdd",
  storageBucket: "rahman-furniture-b8bdd.firebasestorage.app",
  messagingSenderId: "404366983060",
  appId: "1:404366983060:web:8bf8c1677502f7f01c5981"
});
const db = getFirestore(fbApp);
const T = new URLSearchParams(location.search).get('t') || '';
const app = document.getElementById('app'), ov = document.getElementById('ov');
const DEF = ['অর্ডার নিশ্চিত হয়েছে','কাজ ধরা হয়েছে','কাজ মাঝামাঝি পর্যায়ে','ফেব্রিক্স / কভারের কাজ','ফিনিশিং ও ফাইনাল','প্রোডাক্ট রেডি','গাড়ি খোঁজা হচ্ছে','গাড়ি ঠিক হয়েছে','গাড়িতে তোলা হয়েছে / পথে আছে','ডেলিভারি হয়েছে'];
const REVIEW = 'আপনি যদি আপনার প্রোডাক্ট হাতে পেয়ে খুশি হয়ে একটি রিভিউ ভিডিও আমাদের গ্রুপে পোস্ট করেন, তাহলে আপনার জন্য আমরা ছোট্ট একটি গিফট পাঠাব।';
const okU = u => /^https?:\/\//i.test(u || '');
const bn = x => String(x).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'.charAt(d));
function h(tag, cls, txt){ const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e }
function dateBn(iso){ if (!iso) return ''; const d = new Date(iso + 'T00:00:00'); return isNaN(d) ? iso : d.toLocaleDateString('bn-BD', {day:'numeric', month:'long', year:'numeric'}) }
let popOff = false; try { popOff = sessionStorage.getItem('popOff') === '1' } catch(e){}
let popReady = false;
function setupPop(shop){
  const p = document.getElementById('pop'); if (!p || popReady) return; popReady = true;
  p.textContent = '';
  const x = h('button', '', '×'); x.type = 'button'; x.setAttribute('aria-label', 'বন্ধ করুন');
  x.addEventListener('click', () => { p.classList.remove('on'); popOff = true; try { sessionStorage.setItem('popOff', '1') } catch(e){} });
  p.appendChild(x); p.appendChild(h('b', '', 'প্রিয় কাস্টমার')); p.appendChild(document.createElement('br')); p.appendChild(document.createTextNode(REVIEW));
  if (shop && okU(shop.group)) { const a = h('a', '', 'রিভিউ ভিডিও পোস্ট করুন'); a.href = shop.group; a.target = '_blank'; a.rel = 'noopener noreferrer'; p.appendChild(document.createElement('br')); p.appendChild(a) }
  const show = () => { if (popOff) return; p.classList.add('on'); setTimeout(() => p.classList.remove('on'), 12000) };
  setTimeout(show, 4000); setInterval(show, 45000);
}
function render(d){
  const steps = (Array.isArray(d.steps) && d.steps.length) ? d.steps : DEF, st = Math.max(0, Math.min(steps.length - 1, +d.stage || 0)), shop = d.shop || {};
  app.textContent = '';
  const c1 = h('div', 'card'), br = h('div', 'brand');
  if (/^data:image\//.test(shop.logo || '')) { const li = document.createElement('img'); li.src = shop.logo; li.alt = shop.name || ''; br.appendChild(li) }
  if (shop.name) br.appendChild(h('div', 'shop', shop.name));
  if (br.childNodes.length) c1.appendChild(br);
  c1.appendChild(h('h1', '', 'অর্ডার নং ' + (d.no || '')));
  const cu = h('div', 'cust');
  [['👤', d.name], ['📞', d.cphone], ['📍', d.addr], ['🛋️', (d.items || []).join(', ')]].forEach(r => { if (r[1]) { const row = h('div'); row.appendChild(h('i', '', r[0])); row.appendChild(h('span', '', r[1])); cu.appendChild(row) } });
  c1.appendChild(cu);
  if (d.cancelled) { c1.appendChild(h('div', 'cancel', '❌ এই অর্ডারটি বাতিল করা হয়েছে। বিস্তারিত জানতে আমাদের সাথে যোগাযোগ করুন।')) }
  else {
    const now = h('div', 'now'); now.appendChild(h('div', 'muted', 'এখন যে পর্যায়ে আছে')); now.appendChild(h('b', '', steps[st]));
    const bar = h('div', 'bar'), bs = document.createElement('span'); bs.style.width = Math.round((st + 1) * 100 / steps.length) + '%'; bar.appendChild(bs); now.appendChild(bar);
    now.appendChild(h('div', 'muted', 'ধাপ ' + bn(st + 1) + ' / ' + bn(steps.length)));
    if (d.note) now.appendChild(h('div', '', d.note));
    if (d.eta) { const r = h('div', 'muted', 'ডেলিভারির সম্ভাব্য তারিখ: '); r.appendChild(h('b', '', dateBn(d.eta))); now.appendChild(r) }
    c1.appendChild(now);
  }
  app.appendChild(c1);
  if (!d.cancelled) {
    const c2 = h('div', 'card'); c2.appendChild(h('h2', '', 'কাজের ধাপ')); const ul = h('ul', 'tl');
    steps.forEach((s, i) => { const li = h('li', i < st ? 'done' : i === st ? 'cur' : 'todo'); li.style.setProperty('--i', i); li.appendChild(h('span', 'dot', i < st ? '✓' : String(i + 1))); li.appendChild(h('div', 'lbl', s)); ul.appendChild(li) });
    c2.appendChild(ul); app.appendChild(c2);
  }
  const ups = (d.ups || []).slice().reverse();
  if (ups.length) {
    const c3 = h('div', 'card'); c3.appendChild(h('h2', '', 'আপডেট ও ছবি'));
    ups.forEach(u => { const w = h('div', 'up'); w.appendChild(h('div', 'muted', new Date(u.t).toLocaleString('bn-BD'))); if (u.txt) w.appendChild(h('div', '', u.txt));
      if (u.img && /^data:image\//.test(u.img)) { const im = document.createElement('img'); im.src = u.img; im.alt = 'আপডেটের ছবি'; im.addEventListener('click', () => { ov.firstChild.src = u.img; ov.style.display = 'flex' }); w.appendChild(im) }
      c3.appendChild(w) });
    app.appendChild(c3);
  }
  if (okU(shop.fb)) {
    const fb = document.createElement('a'); fb.className = 'fb'; fb.href = shop.fb; fb.target = '_blank'; fb.rel = 'noopener noreferrer';
    fb.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 12a10 10 0 1 0-11.56 9.88v-6.99H7.9V12h2.54V9.8c0-2.5 1.49-3.89 3.78-3.89 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56V12h2.78l-.44 2.89h-2.34v6.99A10 10 0 0 0 22 12z"/></svg>';
    fb.appendChild(document.createTextNode('আমাদের ফেসবুক পেজে যোগাযোগ করুন')); app.appendChild(fb);
  }
  const rv = h('div', 'rv'); rv.appendChild(h('b', '', 'প্রিয় কাস্টমার')); rv.appendChild(h('span', '', REVIEW));
  if (okU(shop.group)) { const ga = h('a', '', 'রিভিউ ভিডিও পোস্ট করুন'); ga.href = shop.group; ga.target = '_blank'; ga.rel = 'noopener noreferrer'; rv.appendChild(document.createElement('br')); rv.appendChild(ga) }
  app.appendChild(rv); setupPop(shop);
  app.appendChild(h('div', 'foot', 'সর্বশেষ হালনাগাদ: ' + (d.upd ? new Date(d.upd).toLocaleString('bn-BD') : '') + (shop.phone ? ' · যোগাযোগ: ' + shop.phone : '')));
}
function fail(m){ app.textContent = ''; const c = h('div', 'card err'); c.appendChild(h('h2', '', m)); c.appendChild(h('div', 'muted', 'লিংকটি ঠিক আছে কিনা দেখুন, অথবা আমাদের সাথে যোগাযোগ করুন।')); app.appendChild(c) }
async function load(first){
  if (!/^[A-Za-z0-9]{16,64}$/.test(T)) { fail('লিংকটি সঠিক নয়'); return }
  try {
    const s = await getDoc(doc(db, 'tracking', T));
    if (s.exists()) render(s.data()); else if (first) fail('এই লিংকে কোনো অর্ডার পাওয়া যায়নি');
  } catch (e) { console.error('tracking load', e && e.code); if (first) fail('এখন লোড করা যাচ্ছে না, একটু পরে আবার চেষ্টা করুন') }
}
ov.addEventListener('click', () => { ov.style.display = 'none' });
load(true); setInterval(() => load(false), 60000);
</script>
</body>
</html>
