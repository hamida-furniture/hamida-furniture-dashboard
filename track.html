<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0b6e6e">
<title>আপনার অর্ডারের অবস্থা</title>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f3;--card:#fff;--fg:#17211f;--muted:#5a6967;--line:#d8e0df;--green:#0b6e6e;--green-soft:#dff1ef;--orange:#e8891c;--orange-soft:#fbe9cc;--red:#c62828;--shadow:0 1px 2px rgba(10,40,38,.05),0 8px 24px rgba(10,40,38,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#0e1514;--card:#182120;--fg:#eef3f2;--muted:#a3b2af;--line:#2a3735;--green:#3fb8ae;--green-soft:#15302d;--orange:#f0a040;--orange-soft:#3a2a10;--red:#ff6b6f;--shadow:0 1px 2px rgba(0,0,0,.3)}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:'Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
.wrap{max-width:600px;margin:0 auto;padding:12px 14px 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;margin:0 0 14px;box-shadow:var(--shadow)}
h2{font-size:19px;margin:0 0 16px}
.muted{color:var(--muted)}.sm{font-size:14px}
.top{display:flex;align-items:center;gap:12px;padding:6px 2px 14px}
.top img{height:44px;width:auto;max-width:120px;object-fit:contain;border-radius:8px}
.shop{font-weight:700;font-size:18px;color:var(--green);flex:1;min-width:0}
.cols{display:flex;flex-direction:column}
.l,.r{display:contents}
.c-hero{order:1}.c-tl{order:2}.c-ups{order:3}.c-info{order:4}.c-acts{order:5}
.lab{font-size:14px;color:var(--muted)}
.big{font-size:27px;font-weight:700;letter-spacing:.2px;line-height:1.25;word-break:break-all}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--orange-soft);border-radius:24px;padding:6px 16px;font-size:15px;font-weight:600;margin-top:10px}
.pill i{width:9px;height:9px;border-radius:50%;background:var(--orange);display:block}
.pill.ok{background:var(--green-soft);color:var(--green)}.pill.ok i{background:var(--green)}
.pill.sm2{padding:3px 11px;font-size:13px;margin:0}
.seg{display:flex;gap:5px;margin-top:16px}.seg span{flex:1;height:7px;border-radius:7px;background:var(--line)}
.seg span.d{background:var(--green)}.seg span.c{background:var(--orange)}.ok-card .seg span.c{background:var(--green)}
.meta{display:flex;justify-content:space-between;gap:8px;margin-top:8px}
.next{margin-top:12px;font-size:15px}.next b{font-weight:600}
.note{margin-top:12px;background:var(--bg);border-radius:12px;padding:10px 12px;font-size:15px}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px 14px}
.g2 .full{grid-column:1/-1}
.val{font-size:18px;font-weight:700;line-height:1.35}
.val.lg{font-size:22px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cancel{background:#ffebee;color:var(--red);border:1.5px solid var(--red);border-radius:12px;padding:12px;font-weight:700;text-align:center}
/* tracking updates (নতুন → পুরনো) */
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;display:flex;gap:14px;padding:0 0 22px}
.tl li:last-child{padding-bottom:0}
.tl li:not(:last-child)::before{content:"";position:absolute;left:21px;top:44px;bottom:2px;width:2px;background:var(--line)}
.dot{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--muted)}
.dot svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tl li.cur .dot{background:var(--orange);color:#1d1200;box-shadow:0 0 0 5px var(--orange-soft)}
.tl li.cur.ok .dot{background:var(--green);color:#fff;box-shadow:0 0 0 5px var(--green-soft)}
.tx{padding-top:2px;min-width:0}.tx .t{font-size:17px}.tl li.cur .t{font-weight:700}.tx .w{font-size:14px;color:var(--muted)}
.cust{font-size:15px;line-height:1.65}.cust div{display:flex;gap:10px;padding:6px 0}
.cust svg,.ic{width:19px;height:19px;margin-top:3px;color:var(--green);stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.up{border-top:1px solid var(--line);padding:12px 0}.up:first-of-type{border-top:0;padding-top:0}
.up img{display:block;max-width:100%;height:auto;border-radius:12px;margin-top:8px;cursor:zoom-in;background:var(--line)}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1;min-width:150px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-weight:700;border-radius:14px;padding:13px 14px;color:#fff;font-size:15px}
.btn svg{width:20px;height:20px;flex:none}
.btn.fb{background:#1877f2}.btn.fb svg{fill:#fff}
.btn.tel{background:var(--green)}.btn.tel svg{stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rv{background:var(--orange-soft);border:1px solid var(--orange);border-radius:18px;padding:16px;margin:0 0 14px}.rv b{display:block;margin-bottom:6px}
.rv a,#pop a{display:inline-block;margin-top:8px;background:var(--orange);color:#1d1200;text-decoration:none;font-weight:700;border-radius:10px;padding:9px 14px}
#pop{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:540px;margin:0 auto;background:var(--card);border:2px solid var(--orange);border-radius:16px;padding:14px 40px 14px 14px;box-shadow:0 10px 30px rgba(0,0,0,.35);transform:translateY(160%);transition:transform .35s ease;z-index:8}
#pop.on{transform:translateY(0)}#pop button{position:absolute;top:6px;right:8px;border:0;background:none;color:var(--muted);font-size:22px;cursor:pointer}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:9;padding:10px}#ov img{max-width:100%;max-height:100%;border-radius:8px}
.foot{text-align:center;color:var(--muted);font-size:13px;padding:6px 0 20px}
.err{text-align:center;padding:40px 14px}
.sk{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--line),transparent,var(--line));background-size:200% 100%;animation:sh 1.2s linear infinite;margin:10px 0}
@keyframes sh{to{background-position:-200% 0}}
.fade{animation:in .25s ease both}@keyframes in{from{opacity:0}to{opacity:1}}
/* ট্যাবলেট */
@media (min-width:600px){.wrap{max-width:680px;padding:20px 20px 32px}.card{padding:26px}.big{font-size:30px}}
/* ল্যাপটপ / পিসি: দুই কলাম */
@media (min-width:900px){
  .wrap{max-width:1040px;padding:28px 24px 40px}
  .cols{flex-direction:row;gap:18px;align-items:flex-start}
  .l,.r{display:block;flex:1;min-width:0}
  .r{flex:1.1}
  .shop{font-size:21px}.top img{height:52px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="card"><div class="sk" style="width:55%"></div><div class="sk" style="height:26px;width:80%"></div><div class="sk"></div><div class="sk" style="width:70%"></div></div></div>
<div id="pop" role="status" aria-live="polite"></div>
<div id="ov" role="dialog" aria-label="ছবি"><img alt=""></div>
<script type="module">
// এই পেজ শুধু একটা ডকুমেন্টই পড়তে পারে: tracking/{গোপন কোড}। লগইন লাগে না, ড্যাশবোর্ডের কোনো ডেটা/লিংক এখানে নেই।
const CFG = {
  apiKey: "AIzaSyCZp4eIXTNfaDiPDVoi4pc04WoPH8e7OFc",
  authDomain: "rahman-furniture-b8bdd.firebaseapp.com",
  projectId: "rahman-furniture-b8bdd",
  storageBucket: "rahman-furniture-b8bdd.firebasestorage.app",
  messagingSenderId: "404366983060",
  appId: "1:404366983060:web:8bf8c1677502f7f01c5981"
};
const T = new URLSearchParams(location.search).get('t') || '';
const app = document.getElementById('app'), ov = document.getElementById('ov');
const DEF = ['অর্ডার নিশ্চিত হয়েছে','কাজ চলছে','ফিনিশিং ও ফাইনাল','প্রোডাক্ট রেডি','গাড়িতে তোলা হয়েছে / পথে আছে','ডেলিভারি হয়েছে'];
const LEG = [0,1,1,1,2,3,3,3,4,5];
const REVIEW = 'আপনি যদি আপনার প্রোডাক্ট হাতে পেয়ে খুশি হয়ে একটি রিভিউ ভিডিও আমাদের গ্রুপে পোস্ট করেন, তাহলে আপনার জন্য আমরা ছোট্ট একটি গিফট পাঠাব।';
const okU = u => /^https?:\/\//i.test(u || '');
const bn = x => String(x).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'.charAt(d));
const SV = (p, extra) => '<svg viewBox="0 0 24 24" aria-hidden="true" ' + (extra || '') + '>' + p + '</svg>';
const I = {
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 016-6h4a6 6 0 016 6v1"/>',
  phone:'<path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3.1 19.5 19.5 0 01-6-6A19.8 19.8 0 012.1 4.2 2 2 0 014.1 2h3a2 2 0 012 1.7c.1 1 .4 1.9.7 2.8a2 2 0 01-.5 2.1L8.1 9.9a16 16 0 006 6l1.3-1.3a2 2 0 012.1-.4c.9.3 1.8.6 2.8.7a2 2 0 011.7 2z"/>',
  pin:'<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0116 0z"/><circle cx="12" cy="10" r="3"/>',
  box:'<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/>',
  cal:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  cam:'<path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/>'
};
function h(tag, cls, txt){ const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e }
function ico(cls, p){ const s = document.createElement('span'); s.innerHTML = SV(p); const v = s.firstChild; if (cls) v.setAttribute('class', cls); return v }
function dateBn(iso){ if (!iso) return ''; const d = new Date(iso + 'T00:00:00'); return isNaN(d) ? iso : d.toLocaleDateString('bn-BD', {day:'numeric', month:'long', year:'numeric'}) }
function norm(d){
  const s = Array.isArray(d.steps) ? d.steps : [];
  if (s.length === 10) { d.stage = LEG[Math.max(0, Math.min(9, +d.stage || 0))]; d.steps = DEF }
  else if (!s.length) d.steps = DEF;
  return d;
}
let popOff = false; try { popOff = sessionStorage.getItem('popOff') === '1' } catch(e){}
let popReady = false;
function setupPop(shop){
  const p = document.getElementById('pop'); if (!p || popReady) return; popReady = true;
  const x = h('button', '', '×'); x.type = 'button'; x.setAttribute('aria-label', 'বন্ধ করুন');
  x.addEventListener('click', () => { p.classList.remove('on'); popOff = true; try { sessionStorage.setItem('popOff', '1') } catch(e){} });
  p.appendChild(x); p.appendChild(h('b', '', 'প্রিয় কাস্টমার')); p.appendChild(document.createElement('br')); p.appendChild(document.createTextNode(REVIEW));
  if (shop && okU(shop.group)) { const a = h('a', '', 'রিভিউ ভিডিও পোস্ট করুন'); a.href = shop.group; a.target = '_blank'; a.rel = 'noopener noreferrer'; p.appendChild(document.createElement('br')); p.appendChild(a) }
  const show = () => { if (popOff) return; p.classList.add('on'); setTimeout(() => p.classList.remove('on'), 12000) };
  setTimeout(show, 6000); setInterval(show, 60000);
}
let lastSig = '';
const fmtDT = t => { const d = new Date(t); return isNaN(d) ? '' : d.toLocaleString('bn-BD', {day:'numeric', month:'short', year:'numeric', hour:'numeric', minute:'2-digit'}) };
const money = n => '৳ ' + (+n || 0).toLocaleString('bn-BD');
function sect(cls){ return h('div', 'card ' + cls) }
function kv(label, valNode, full, big){ const c = h('div', full ? 'full' : ''); c.appendChild(h('div', 'lab', label)); if (typeof valNode === 'string') c.appendChild(h('div', 'val' + (big ? ' lg' : ''), valNode)); else c.appendChild(valNode); return c }
function render(d){
  norm(d);
  const sig = JSON.stringify([d.upd, d.stage, d.cancelled, (d.ups || []).length, d.amt]);
  if (sig === lastSig && app.firstChild && !app.querySelector('.sk')) return;
  lastSig = sig;
  const steps = d.steps, N = steps.length, st = Math.max(0, Math.min(N - 1, +d.stage || 0)), shop = d.shop || {}, fin = st === N - 1 && !d.cancelled;
  const tm = {}; (d.hist || []).forEach(x => { tm[x.s] = x.t });
  const frag = document.createDocumentFragment();
  const top = h('div', 'top');
  if (/^data:image\//.test(shop.logo || '')) { const li = document.createElement('img'); li.src = shop.logo; li.alt = shop.name || ''; top.appendChild(li) }
  top.appendChild(h('div', 'shop', shop.name || ''));
  frag.appendChild(top);
  const cols = h('div', 'cols'), L = h('div', 'l'), R = h('div', 'r'); cols.appendChild(L); cols.appendChild(R);

  // ── হিরো কার্ড ──
  const hero = sect('c-hero' + (fin ? ' ok-card' : ''));
  hero.appendChild(h('div', 'lab', 'অর্ডার নম্বর'));
  hero.appendChild(h('div', 'big', '#' + (d.no || '')));
  if (d.name) hero.appendChild(h('div', 'lab', d.name));
  if (d.cancelled) {
    const x = h('div', 'cancel', 'এই অর্ডারটি বাতিল করা হয়েছে। বিস্তারিত জানতে আমাদের সাথে যোগাযোগ করুন।'); x.style.marginTop = '14px'; hero.appendChild(x);
  } else {
    const pill = h('span', 'pill' + (fin ? ' ok' : '')); pill.appendChild(h('i')); pill.appendChild(document.createTextNode(fin ? 'ডেলিভারি সম্পন্ন' : 'চলমান — ' + steps[st])); hero.appendChild(pill);
    const seg = h('div', 'seg'); for (let i = 0; i < N; i++) seg.appendChild(h('span', i < st || fin ? 'd' : i === st ? 'c' : '')); hero.appendChild(seg);
    const m = h('div', 'meta lab'); m.appendChild(h('span', '', 'ধাপ ' + bn(st + 1) + ' / ' + bn(N))); m.appendChild(h('span', '', bn(Math.round((st + 1) * 100 / N)) + '%')); hero.appendChild(m);
    if (!fin) { const n = h('div', 'next muted', 'পরবর্তী ধাপ: '); n.appendChild(h('b', '', steps[st + 1])); n.firstChild.parentNode.lastChild.style.color = 'var(--fg)'; hero.appendChild(n) }
    if (d.note) hero.appendChild(h('div', 'note', d.note));
  }
  const a = d.amt, hasInfo = tm[0] || (d.eta && !fin) || a;
  if (hasInfo) {
    hero.appendChild(document.createElement('hr'));
    const g = h('div', 'g2');
    if (tm[0]) g.appendChild(kv('অর্ডার নিশ্চিত হয়েছে', fmtDT(tm[0]), true));
    if (d.eta && !fin && !d.cancelled) g.appendChild(kv('ডেলিভারির সম্ভাব্য তারিখ', dateBn(d.eta), true));
    if (a) {
      g.appendChild(kv('মোট বিল', money(a.t)));
      g.appendChild(kv('পরিশোধিত', money(a.p)));
      const due = +a.d || 0, w = h('div', 'row'); w.appendChild(h('div', 'val lg', money(due)));
      const dp = h('span', 'pill sm2' + (due <= 0 ? ' ok' : '')); dp.appendChild(h('i')); dp.appendChild(document.createTextNode(due <= 0 ? 'পরিশোধিত' : 'বাকি')); w.appendChild(dp);
      g.appendChild(kv(due > 0 ? 'বাকি টাকা (ডেলিভারির সময় দিতে হবে)' : 'বাকি টাকা', w, true));
    }
    hero.appendChild(g);
  }
  L.appendChild(hero);

  // ── Tracking updates (নতুন → পুরনো) ──
  if (!d.cancelled) {
    const c2 = sect('c-tl'); c2.appendChild(h('h2', '', 'ট্র্যাকিং আপডেট')); const ul = h('ul', 'tl');
    for (let i = st; i >= 0; i--) {
      const cur = i === st, li = h('li', (cur ? 'cur' : '') + (cur && fin ? ' ok' : ''));
      const dot = h('span', 'dot'); dot.innerHTML = SV(cur ? (fin ? I.box : I.clock) : '<path d="M5 12.5l4.5 4.5L19 7.5"/>');
      const tx = h('div', 'tx'); tx.appendChild(h('div', 't', steps[i])); if (tm[i]) tx.appendChild(h('div', 'w', fmtDT(tm[i])));
      li.appendChild(dot); li.appendChild(tx); ul.appendChild(li);
    }
    c2.appendChild(ul); R.appendChild(c2);
  }
  // ── ছবি ও নোট আপডেট ──
  const ups = (d.ups || []).slice().reverse();
  if (ups.length) {
    const c3 = sect('c-ups'); c3.appendChild(h('h2', '', 'আপডেট ও ছবি'));
    ups.forEach(u => {
      const w = h('div', 'up'); w.appendChild(h('div', 'muted sm', fmtDT(u.t))); if (u.txt) w.appendChild(h('div', '', u.txt));
      if (u.img && /^data:image\//.test(u.img)) { const im = document.createElement('img'); im.decoding = 'async'; im.loading = 'lazy'; im.src = u.img; im.alt = 'আপডেটের ছবি'; im.addEventListener('click', () => { ov.firstChild.src = u.img; ov.style.display = 'flex' }); w.appendChild(im) }
      c3.appendChild(w);
    });
    R.appendChild(c3);
  }
  // ── অর্ডারের তথ্য ──
  const rows = [[I.phone, d.cphone], [I.pin, d.addr], [I.box, (d.items || []).join(', ')]].filter(r => r[1]);
  if (rows.length) {
    const c1 = sect('c-info'); c1.appendChild(h('h2', '', 'অর্ডারের তথ্য')); const cu = h('div', 'cust');
    rows.forEach(r => { const row = h('div'); row.appendChild(ico('', r[0])); row.appendChild(h('span', '', r[1])); cu.appendChild(row) });
    c1.appendChild(cu); L.appendChild(c1);
  }
  // ── যোগাযোগ ──
  const acts = h('div', 'acts c-acts'); acts.style.marginBottom = '14px';
  const ph = String(shop.phone || '').split(/[,\/\n]/)[0].replace(/[^\d+]/g, '');
  if (ph) { const x = document.createElement('a'); x.className = 'btn tel'; x.href = 'tel:' + ph; x.innerHTML = SV(I.phone); x.appendChild(document.createTextNode('কল করুন')); acts.appendChild(x) }
  if (okU(shop.fb)) { const x = document.createElement('a'); x.className = 'btn fb'; x.href = shop.fb; x.target = '_blank'; x.rel = 'noopener noreferrer'; x.innerHTML = SV('<path d="M22 12a10 10 0 1 0-11.56 9.88v-6.99H7.9V12h2.54V9.8c0-2.5 1.49-3.89 3.78-3.89 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56V12h2.78l-.44 2.89h-2.34v6.99A10 10 0 0 0 22 12z"/>'); x.appendChild(document.createTextNode('ফেসবুক পেজ')); acts.appendChild(x) }
  if (acts.childNodes.length) L.appendChild(acts);
  frag.appendChild(cols);
  // ── রিভিউ ──
  const rv = h('div', 'rv'); rv.appendChild(h('b', '', 'প্রিয় কাস্টমার')); rv.appendChild(h('span', '', REVIEW));
  if (okU(shop.group)) { const ga = h('a', '', 'রিভিউ ভিডিও পোস্ট করুন'); ga.href = shop.group; ga.target = '_blank'; ga.rel = 'noopener noreferrer'; rv.appendChild(document.createElement('br')); rv.appendChild(ga) }
  frag.appendChild(rv);
  frag.appendChild(h('div', 'foot', 'সর্বশেষ হালনাগাদ: ' + (d.upd ? fmtDT(d.upd) : '') + (shop.phone ? ' · যোগাযোগ: ' + shop.phone : '')));
  const y = window.scrollY;
  app.textContent = ''; app.className = 'wrap fade'; app.appendChild(frag); window.scrollTo(0, y);
  setupPop(shop);
  try { document.title = (shop.name ? shop.name + ' — ' : '') + 'অর্ডার #' + (d.no || '') } catch(e){}
}
function fail(m){ app.textContent = ''; const c = h('div', 'card err'); c.appendChild(h('h2', '', m)); c.appendChild(h('div', 'muted', 'লিংকটি ঠিক আছে কিনা দেখুন, অথবা আমাদের সাথে যোগাযোগ করুন।')); app.appendChild(c) }
function cacheGet(){ try { const x = localStorage.getItem('rfT_' + T); return x ? JSON.parse(x) : null } catch(e){ return null } }
function cacheSet(d){ try { const c = JSON.parse(JSON.stringify(d)); (c.ups || []).forEach(u => { u.img = '' }); localStorage.setItem('rfT_' + T, JSON.stringify(c)) } catch(e){} }

if (!/^[A-Za-z0-9]{16,64}$/.test(T)) { fail('লিংকটি সঠিক নয়') }
else {
  const c0 = cacheGet(); if (c0) render(c0);           // আগে দেখা থাকলে সাথে সাথে দেখায়
  let getDoc, doc, db, got = !!c0;
  const boot = Promise.all([
    import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"),
    import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js")
  ]).then(([a, f]) => { getDoc = f.getDoc; doc = f.doc; db = f.getFirestore(a.initializeApp(CFG)) });
  async function load(first){
    try {
      await boot;
      const s = await getDoc(doc(db, 'tracking', T));
      if (s.exists()) { const d = s.data(); got = true; cacheSet(d); render(d) }
      else if (first && !got) fail('এই লিংকে কোনো অর্ডার পাওয়া যায়নি');
    } catch (e) { console.error('tracking load', e && e.code); if (first && !got) fail('এখন লোড করা যাচ্ছে না, একটু পরে আবার চেষ্টা করুন') }
  }
  load(true);
  setInterval(() => { if (!document.hidden) load(false) }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(false) });
}
ov.addEventListener('click', () => { ov.style.display = 'none' });
</script>
