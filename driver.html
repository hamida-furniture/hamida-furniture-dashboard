<style>

    rsec = 0; rec.start(); rtimer = setInterval(() => { rsec++; if (rsec >= 60) stopRec(); else drawVoice() }, 1000); drawVoice();
  } catch (e) { stopTracks(); ms.textContent = 'মাইক্রোফোনের অনুমতি পাওয়া যায়নি, ব্রাউজারের সেটিংসে অনুমতি দিন, অথবা লিখিত নোট দিন।'; ms.classList.add('on') }
}
function stopRec(){ try { if (rec && rec.state === 'recording') rec.stop() } catch (e) {} }

async function submit(){
  if (sending || !current) return;
  const ai = document.getElementById('amt'), ms = document.getElementById('ms'), wn = document.getElementById('wn'), sb = document.getElementById('sb');
  ms.classList.remove('on');
  if (rec && rec.state === 'recording') { ms.textContent = 'আগে ভয়েস রেকর্ড থামান।'; ms.classList.add('on'); return }
  const raw = ai.value.trim(), amt = Math.round(parseFloat(raw));
  if (raw === '' || isNaN(amt) || amt < 0 || amt > 100000000) { ms.textContent = 'টাকার অংক লিখুন (কিছু না পেলে ০)।'; ms.classList.add('on'); ai.focus(); return }
  const due = +current.due || 0;
  if (!armed) {
    armed = true; sb.textContent = 'হ্যাঁ, ' + money(amt) + ' জমা দিন';
    wn.textContent = 'আপনি ' + money(amt) + ' পেয়েছেন' + (due > 0 && amt !== due ? ' (নেওয়ার কথা ছিল ' + money(due) + ')' : '') + '। ঠিক থাকলে আবার চাপুন, জমা দিলে এটা আপনার ফোন থেকে সরে যাবে।';
    wn.classList.add('on'); return;
  }
  const note = (document.getElementById('nt').value || '').trim().slice(0, 400), k = current.k, it = current;
  sending = true; sb.disabled = true; sb.textContent = 'জমা হচ্ছে…';
  try {
    const b = writeBatch(db), id = R + '_' + k;
    b.set(doc(db, 'runReports', id), {run: R, key: k, inv: String(it.inv || ''), driver: String(run.name || ''), received: amt, due, note, hasVoice: !!voice, at: Date.now(), applied: false});
    if (voice) b.set(doc(db, 'runVoice', id), {run: R, key: k, mime: vmime || 'audio/webm', data: voice, at: Date.now()});
    b.update(doc(db, 'runs', R), {['items.' + k]: deleteField()});
    await b.commit();
    doneAdd(k, amt); sending = false; closeSheet(true); try { navigator.vibrate && navigator.vibrate(40) } catch (e) {}
    const pp = h('div', 'pop'), pb = h('div'); pb.appendChild(svg('<path d="M5 13l4 4L19 7"/>')); pb.appendChild(document.createTextNode('জমা হয়েছে, ধন্যবাদ')); pp.appendChild(pb); document.body.appendChild(pp); setTimeout(() => pp.remove(), 1500);
    const card = app.querySelector('.card[data-k="' + k + '"]'); if (card) { card.classList.add('out'); setTimeout(() => render(run), 360) } else render(run);
  } catch (e) {
    console.error('submit', e && e.code); sending = false; sb.disabled = false; sb.textContent = 'আবার চেষ্টা করুন'; armed = true;
    ms.textContent = (e && e.code === 'permission-denied') ? 'অফিস এই ডেলিভারিটি লক বা বন্ধ করে দিয়েছে। অফিসে যোগাযোগ করুন।' : 'জমা হয়নি, ইন্টারনেট দেখে আবার চেষ্টা করুন।';
    ms.classList.add('on');
  }
}
sh.addEventListener('click', e => { if (e.target === sh) closeSheet() });
function openNotices(notices){
  nfsheet.textContent = '';
  nfsheet.appendChild(h('h3', '', '🔔 অফিসের বার্তা'));
  if (!notices.length) nfsheet.appendChild(h('div', 'nfempty', 'এখনো কোনো বার্তা আসেনি'));
  else notices.slice().reverse().forEach(n => {
    const it = h('div', 'nfit'); const ic = h('div', 'ic'); ic.appendChild(svg(IC.bell)); it.appendChild(ic);
    const bd = h('div', 'bd'); bd.appendChild(h('p', '', n.msg || '')); bd.appendChild(h('small', '', fmtWhen(n.at)));
    it.appendChild(bd); nfsheet.appendChild(it);
  });
  nf.classList.add('on');
  try { localStorage.setItem('rfSeen_' + R, String(notices.length)) } catch (e) {}
  if (run) render(run);
}
function fmtWhen(t){ try { return new Date(t).toLocaleString('bn-BD', {day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit'}) } catch (e) { return '' } }
nf.addEventListener('click', e => { if (e.target === nf) nf.classList.remove('on') });
window.addEventListener('online', () => { const o = document.getElementById('off'); if (o) o.classList.remove('on') });
window.addEventListener('offline', () => { const o = document.getElementById('off'); if (o) o.classList.add('on') });

// ───── ফোনে অ্যাপের মতো ইনস্টল (PWA): ম্যানিফেস্ট, সার্ভিস ওয়ার্কার, ইনস্টল বাটন ─────
(function setupPWA(){
  try{
    const abs = p => new URL(p, location.href).href;
    const manifest = {
      name: (run && run.shop ? run.shop + ': ' : '') + 'ডেলিভারি লিস্ট',
      short_name: 'ডেলিভারি লিস্ট',
      start_url: location.pathname + location.search,
      scope: location.pathname.replace(/[^/]+$/, ''),
      display: 'standalone',
      background_color: '#eef3f3',
      theme_color: '#0b6e6e',
      icons: [
        {src: abs('icon-192.png'), sizes: '192x192', type: 'image/png', purpose: 'any maskable'},
        {src: abs('icon-512.png'), sizes: '512x512', type: 'image/png', purpose: 'any maskable'}
      ]
    };
    const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
    const link = document.createElement('link'); link.rel = 'manifest'; link.href = URL.createObjectURL(blob);
    document.head.appendChild(link);
  }catch(e){}
  if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js').catch(() => {}) }
  const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  if (standalone) return;
  const inst = document.getElementById('inst'), instB = document.getElementById('inst-b'), instX = document.getElementById('inst-x'), instT = document.getElementById('inst-t');
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
  let dismissed = false; try { dismissed = sessionStorage.getItem('rfInstDismiss') === '1' } catch (e) {}
  let deferred = null;
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; if (!dismissed) inst.classList.add('on') });
  window.addEventListener('appinstalled', () => { inst.classList.remove('on'); deferred = null });
  if (isIOS && !dismissed) { instT.innerHTML = '<b>ফোনে অ্যাপের মতো রাখুন</b>নিচে Share বাটনে চেপে "Add to Home Screen" বেছে নিন'; instB.style.display = 'none'; inst.classList.add('on') }
  instB.addEventListener('click', async () => { if (!deferred) return; deferred.prompt(); try { await deferred.userChoice } catch (e) {} deferred = null; inst.classList.remove('on') });
  instX.addEventListener('click', () => { inst.classList.remove('on'); try { sessionStorage.setItem('rfInstDismiss', '1') } catch (e) {} });
})();
let db;
// অফিসের জন্য চুপচাপ লাইভ লোকেশন — ড্রাইভারের স্ক্রিনে এর কোনো চিহ্ন (ব্যাজ/টেক্সট/আইকন) নেই, শুধু পেজ খোলা থাকলে পেছন থেকে অবস্থান পাঠানো হয়
let locTimer = null;
function startLocSync(){
  if (locTimer || !navigator.geolocation || !R) return;
  const send = () => { try { navigator.geolocation.getCurrentPosition(pos => {
    updateDoc(doc(db, 'runs', R), {loc: {lat: +pos.coords.latitude.toFixed(5), lng: +pos.coords.longitude.toFixed(5), at: Date.now()}}).catch(() => {});
  }, () => {}, {enableHighAccuracy: true, timeout: 15000, maximumAge: 20000}) } catch (e) {} };
  send(); locTimer = setInterval(send, 45000);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) { clearInterval(locTimer); locTimer = null } else startLocSync() });
if (!/^[A-Za-z0-9]{16,64}$/.test(R)) fail('লিংকটি সঠিক নয়');
else {
  db = getFirestore(initializeApp(CFG));
  startLocSync();
  let first = true;
  onSnapshot(doc(db, 'runs', R), snap => {
    first = false;
    if (!snap.exists()) { fail('এই লিংকটি আর চালু নেই'); return }
    const d = snap.data();
    if (d.exp && Date.now() > d.exp) { fail('লিংকের মেয়াদ শেষ'); return }
    checkNewNotice(d);
    if (sh.classList.contains('on')) { run = d; return }   // শিট খোলা থাকলে নিচের তালিকা নড়াচড়া করবে না
    render(d);
  }, err => {
    console.error('run', err && err.code);
    if (err && err.code === 'permission-denied') fail('লিংকটি সঠিক নয় বা মেয়াদ শেষ');
    else if (first) fail('এখন লোড করা যাচ্ছে না', 'ইন্টারনেট দেখে একটু পরে আবার খুলুন।');
  });
}
